<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FD1C5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4FD1C5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FD1C5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon/Symbol -->
  <g transform="translate(2, 4)">
    <!-- Outer hexagon (blockchain/tech feel) -->
    <path d="M16 2 L26 8 L26 20 L16 26 L6 20 L6 8 Z" 
          fill="url(#logoGradient)" 
          opacity="0.1" 
          stroke="url(#logoGradient)" 
          stroke-width="1.5"/>
    
    <!-- Inner geometric pattern -->
    <circle cx="16" cy="14" r="3" fill="url(#logoGradient)" opacity="0.8"/>
    <path d="M16 8 L20 11 L16 14 L12 11 Z" fill="url(#logoGradient)" opacity="0.6"/>
    <path d="M16 14 L20 17 L16 20 L12 17 Z" fill="url(#logoGradient)" opacity="0.6"/>
    
    <!-- Connection lines (representing blockchain/network) -->
    <line x1="10" y1="11" x2="13" y2="13" stroke="url(#logoGradient)" stroke-width="1" opacity="0.7"/>
    <line x1="22" y1="11" x2="19" y2="13" stroke="url(#logoGradient)" stroke-width="1" opacity="0.7"/>
    <line x1="10" y1="17" x2="13" y2="15" stroke="url(#logoGradient)" stroke-width="1" opacity="0.7"/>
    <line x1="22" y1="17" x2="19" y2="15" stroke="url(#logoGradient)" stroke-width="1" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="38" y="16" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="url(#textGradient)">
    Trisha
  </text>
  <text x="38" y="30" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#9CA3AF" opacity="0.8">
    Web3 Dev
  </text>
</svg>
